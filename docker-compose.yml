services:
  postgres:
    image: postgres:16
    container_name: product_catalog_redis_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_catalog_redis
    ports:
      - "5433:5432"
    volumes:
      - postgres_redis_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_catalog_redis"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: product_catalog_redis_cache
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: node:20-alpine
    container_name: product_catalog_redis_backend
    working_dir: /app
    command: sh -c "npm install && npm run start"
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/product_catalog_redis
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 120
      CORS_ORIGIN: http://localhost:5174,http://localhost:4174
      REDIS_COMMAND_TIMEOUT_MS: 100
    volumes:
      - ./backend:/app
      - redis_backend_node_modules:/app/node_modules
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: product_catalog_redis_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      VITE_API_BASE_URL: http://localhost:5001
    volumes:
      - ./frontend:/app
      - redis_frontend_node_modules:/app/node_modules
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  postgres_redis_data:
  redis_data:
  redis_backend_node_modules:
  redis_frontend_node_modules:
